<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Industrial Automation | MD Imran Hossen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>

<body>
<main class="panel">

  <header class="head">
    <div class="id">
      <h1>MD Imran Hossen</h1>
      <h2>Mechatronics</h2>
    </div>
    <div id="statusBadge" class="status-badge offline">Offline</div>
  </header>

  <p class="sub">Industrial Automation Console</p>

  <!-- Login UI -->
  <div id="authBox">
    <label class="field">
      <span>Email</span>
      <input id="emailField" type="email" placeholder="you@example.com" autocomplete="username" />
    </label>
    <label class="field">
      <span>Password</span>
      <input id="passwordField" type="password" placeholder="Enter password" autocomplete="current-password" />
    </label>
    <button id="loginBtn" class="btn login-btn">Sign in</button>
    <p id="authMsg" role="alert"></p>
  </div>

  <!-- Control UI -->
  <div id="controlBox" style="display:none;">

    <div class="device">
      <button id="gpio1Btn" class="gpio-button" data-gpio="gpio1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6M10 17h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span class="name">Light 1</span>
        <span class="switch"></span>
      </button>
      <div id="gpio1Status" class="gpio-status">Status: OFF</div>
    </div>

    <div class="device">
      <button id="gpio2Btn" class="gpio-button" data-gpio="gpio2">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6M10 17h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span class="name">Light 2</span>
        <span class="switch"></span>
      </button>
      <div id="gpio2Status" class="gpio-status">Status: OFF</div>
    </div>

    <div class="device">
      <button id="gpio3Btn" class="gpio-button" data-gpio="gpio3">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.5"/><path d="M12 10.5C10.5 7 10.8 4 13 3.5c2.2-.5 3 2.500 1 6M13.5 12c3.500-1.500 6.500-1 7 1.200.5 2.200-2.500 3-6 1M12 13.500c1.500 3.500 1.200 6.500-1 7-2.200.5-3-2.500-1-6M10.500 12C7 13.500 4 13 3.500 10.800 3 8.600 6 7.800 9.500 9.500"/></svg>
        <span class="name">Fan 3</span>
        <span class="switch"></span>
      </button>
      <div id="gpio3Status" class="gpio-status">Status: OFF</div>
    </div>

    <button id="logoutBtn" class="btn logout-btn">Sign out</button>
  </div>

</main>
</body>
</html>
